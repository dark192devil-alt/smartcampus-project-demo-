{% extends "base.html" %}
{% block content %}
<a class="skip-link" href="#faculty-main">Skip to content</a><div class="student-app"><aside class="student-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="facultySidebar"><div class="brand-lockup"><span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span><span><strong>SmartCampus</strong><small>Faculty portal</small></span></div><nav class="student-nav" aria-label="Faculty navigation"><a class="{% if request.endpoint == 'faculty.dashboard' %}active{% endif %}" href="{{ url_for('faculty.dashboard') }}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a><a class="{% if request.endpoint == 'faculty.attendance' %}active{% endif %}" href="{{ url_for('faculty.attendance') }}"><i class="bi bi-bar-chart-line-fill"></i> Attendance</a><a class="{% if request.endpoint == 'faculty.assignments' %}active{% endif %}" href="{{ url_for('faculty.assignments') }}"><i class="bi bi-journal-check"></i> Assignments</a><a class="{% if request.endpoint == 'faculty.submissions' %}active{% endif %}" href="{{ url_for('faculty.submissions') }}"><i class="bi bi-inbox-fill"></i> Submissions</a><a class="{% if request.endpoint == 'faculty.exams' %}active{% endif %}" href="{{ url_for('faculty.exams') }}"><i class="bi bi-pencil-square"></i> Exams</a><a class="{% if request.endpoint == 'faculty.notices' %}active{% endif %}" href="{{ url_for('faculty.notices') }}"><i class="bi bi-megaphone-fill"></i> Notices</a></nav><div class="sidebar-footer"><a href="{{ url_for('auth.profile') }}"><i class="bi bi-person-circle"></i> {{ current_user.name }}</a><a href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right"></i> Log out</a></div></aside><main class="student-main" id="faculty-main"><button class="mobile-nav-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#facultySidebar" aria-label="Open navigation"><i class="bi bi-list"></i></button>{% block faculty_content %}{% endblock %}</main></div>
{% endblock %}
